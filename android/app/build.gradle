plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yandex.boards'
    compileSdk 36

    defaultConfig {
        applicationId "com.yandex.boards"
        minSdk 26  // Android 12+
        targetSdk 36  // Android 16+
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.webkit:webkit:1.12.1'

    // Поддержка мультитаскинга и foldable устройств
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'

    // Gson для парсинга JSON
    implementation 'com.google.code.gson:gson:2.12.1'

    // Chrome Custom Tabs
    implementation 'androidx.browser:browser:1.8.0'
}
